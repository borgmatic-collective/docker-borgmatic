services:

  borgmaticrestore:
    image: ghcr.io/borgmatic-collective/borgmatic:latest
    container_name: Borg-restore
    # Match the main service. With borgmatic's default archive naming the
    # hostname is part of the archive name, so 'latest' only finds archives
    # created under the same hostname (or set archive_hostname in the config).
    hostname: borgmatic
    volumes:
      - ${VOLUME_TARGET}:/mnt/borg-repository     # backup repository
      - ${BORG_RESTORE}:/mnt/restore                # restore target
      - ${VOLUME_ETC_BORGMATIC}:/etc/borgmatic.d/ # borgmatic config file(s) + crontab.txt
      - ${VOLUME_BORG_CONFIG}:/root/.config/borg  # config and keyfiles
      - ${VOLUME_SSH}:/root/.ssh                  # ssh key for remote repositories
      - ${VOLUME_BORG_CACHE}:/root/.cache/borg    # checksums used for deduplication
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - label:disable
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - TZ=$TZ
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      # No scheduled backups from the restore container
      - CRON=false
    command: /bin/bash
